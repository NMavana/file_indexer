[package]
name = "file-indexer"
version = "0.8.8"
description = "Index and search files locally"
authors = ["File Indexer"]
edition = "2021"

[lib]
name = "file_indexer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
